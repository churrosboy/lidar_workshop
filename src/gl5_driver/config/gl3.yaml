gl5_node:
  ros__parameters:
    # GL3: 180 deg horizontal FOV, 1000 points per scan. Same UDP protocol as GL5.
    lidar_type: "GL3"
    # Adjust if the GL3 is configured with a different IP/port (check with the SOSLAB tool).
    sensor_ip: "10.110.1.2"
    sensor_port: 2000
    pc_ip: "10.110.1.3"
    pc_port: 3000
    frame_id: "laser"
    range_min: 0.0
    range_max: 60.0
    angle_offset: 0.0
