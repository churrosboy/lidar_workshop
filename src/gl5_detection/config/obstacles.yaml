gl5_obstacle_detector:
  ros__parameters:
    # /scan 및 RViz Fixed Frame과 일치시킵니다.
    frame_id: "laser"

    # [배경 차분]
    # 시작 직후(또는 Learn Background 버튼) 아래 프레임 수만큼 스캔을 모아 배경을 점 지도로 저장합니다.
    # 이후 매 스캔을 그 지도에 ICP로 정렬한 뒤, 지도의 어떤 점과도 (margin + ratio*거리) 이상 떨어진
    # 점을 장애물 후보로 봅니다. 가까워지든 멀어지든 배경과 다른 자리에 있으면 잡힙니다.
    # 센서가 조금 돌아가거나 밀려도 정렬이 따라가지만, 크게 옮기면 Learn Background를 다시 누르세요.
    # false로 두면 예전처럼 모든 점을 그대로 사용합니다.
    background_enabled: true
    # 학습에 쓰는 스캔 수 (약 40 Hz 기준 80 = 2초). 학습 중에는 영역을 비우고 센서를 고정하세요.
    background_learn_frames: 80
    # 지도에서 이만큼(m) 떨어져야 전경으로 봅니다. 키우면 잡음이 줄고 얇은 물체를 놓칠 수 있습니다.
    background_margin: 0.15
    # 거리에 비례하는 추가 여유 (2% = 10 m에서 0.2 m).
    background_ratio: 0.02

    # [클러스터링]
    # 장애물로 인정할 묶음의 최소 유효 측정점 수 (무효점 제외).
    # 키우면 작은 잡음이 줄지만 작은 물체·먼 물체를 놓칠 수 있습니다.
    min_points: 5
    # 같은 군집으로 묶는 스캔 순서상 이웃 유효점 사이 최대 거리 (m).
    # 키우면 하나의 물체가 덜 쪼개지지만 가까운 두 물체가 합쳐질 수 있습니다.
    # 무효점은 건너뛰고 앞뒤 유효점 사이 거리로 판단합니다.
    # 영역 밖 점은 이 값과 관계없이 군집을 끊습니다.
    cluster_gap: 0.30

    # [경고 상태] 단위: 초. 박스는 즉시 표시하고 경고 상태만 지연합니다.
    enter_delay: 0.2
    exit_delay: 0.5
    # 이 시간 동안 유효한 스캔이 없으면 NO_DATA로 전환합니다.
    data_timeout: 1.0

    # [물체 추적]
    # 이전 박스의 예측 중심과 현재 중심 사이 허용 거리 (m).
    track_match_distance: 0.4
    # 사라진 추적 정보를 유지하는 최대 시간 (초).
    track_max_age: 0.5
    # 속도 계산에 사용하는 위치 이력 길이 (초, 0.2 이상).
    # 키우면 값이 부드러워지고 속도 변화에 대한 반응은 느려집니다.
    speed_window: 0.4

    # [충돌 예측]
    # 영역 밖 물체도 추적하며, 현재 속도로 직진한다고 가정해 영역 진입 시각을 예측합니다.
    # 예측을 시도하는 최대 시간 (초).
    predict_horizon: 3.0
    # 예측 경로를 따라가는 시간 간격 (초). 작을수록 정확하지만 계산이 늘어납니다.
    predict_step: 0.1
    # 진입 예상 시간이 이 값 이하이면 WARNING 상태가 되고 박스가 노란색이 됩니다 (초).
    warning_time: 2.0
    # 이보다 느린 물체는 예측하지 않습니다 (m/s). 정지 물체 주변 깜빡임 방지.
    min_predict_speed: 0.1
    # RViz에 그리는 지나온 궤적 점 개수 (약 40 Hz 기준 60 = 1.5초).
    trail_length: 60

    # [RViz 표시 및 영역 선택]
    # 박스 위 3줄 빨간 라벨의 글자 높이 (m).
    label_height: 0.14
    # 첫 꼭짓점을 다시 클릭해 영역을 닫을 때 허용 반경 (m).
    close_radius: 0.15
    # 영역 좌표 파일은 실행 인자 region_file로 별도 지정합니다.
